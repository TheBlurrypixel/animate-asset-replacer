name: Build macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build macOS CLI and Electron app
        run: npm run dist:mac:native

      - name: Upload macOS portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Animate-Asset-Replacer-macOS-${{ matrix.arch }}
          path: release/macos-${{ matrix.arch }}/Animate-Asset-Replacer-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
