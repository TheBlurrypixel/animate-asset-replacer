name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build Windows CLI and Electron app
        run: npm run dist:win

      - name: Create portable Windows ZIP
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $source = "release/windows-x64/win-unpacked"
          $zip = "release/windows-x64/Animate-Asset-Replacer-$version-Windows-Portable.zip"
          if (-not (Test-Path $source)) {
            throw "Portable source folder not found: $source"
          }
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$source/*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created portable ZIP: $zip"

      - name: Upload Windows distributions
        uses: actions/upload-artifact@v4
        with:
          name: Animate-Asset-Replacer-Windows-x64
          path: |
            release/windows-x64/Animate Asset Replacer Setup *.exe
            release/windows-x64/Animate-Asset-Replacer-*-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 14
